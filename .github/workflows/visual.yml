name: Visual

# AA-1008 (S1d/S2c; root ADR 0016 decision 9, re-scoped by ADR 0019 d23: the frontends leave Vercel, so the per-PR run
# needs no preview) — the visual run of the Booking staff admin from GitHub's network, never the agent machine's IP.
# Every changed page (frontend/e2e/visual/changed-pages.mjs over the diff; a ui / lib / shell change = every page) at
# 1440 x 900 and 390 x 844, light and dark, asserting: no page-level horizontal overflow (the document AND the kit
# frame, which scrolls on its own), 0 console errors, no failed same-origin request, no API call without a layout-mock
# fixture, the kit frame present, the theme applied. Screenshots + report.json are the artifact
# `visual-booking-<target>-<run id>` (14 days); the job summary carries the page x 4 table (the PR comment went with
# the per-PR run, S271).
#
# Required check (AA-1008 H3): the job `pr` reports on EVERY pull request (as "skipped" since S271: the per-PR run
# moved to the queue) and runs on the merge queue (merge_group), so it can be a required status check;
# its name "Visual (next start, mocked API + kit gallery)" is the required context
# (the tech lead's branch-protection script and verify-h3.sh pin it: never rename it). There is no `paths:` filter (a
# required check must report on every PR, and merge_group ignores path filters): the job's first step after the
# checkout, Scope, diffs the PR (or the queue group) against its base and matches the old filter's path list; no match
# = "no frontend change" in the summary, every later step skipped, the job green. The skip is step-level on purpose: a
# separate scope job with a job-level if/needs reports "skipped", which GitHub counts as passed even when the scope job
# itself failed.
#
# Jobs:
#   pr        merge_group (frontend / workflow files, decided by the Scope step) and dispatch without base_url
#             (skipped on pull_request since S271): `next build` and `next start` with
#             KIT_GALLERY=1 in the runner, the Booking API mocked by the AA-910 layout harness (e2e/layout/fixtures.ts
#             answers /api/booking/*, e2e/layout/stub-api.mjs the one server-side call; an unsigned session cookie that
#             proxy.ts only decodes, production auth unchanged): the staff and public pages that changed + the gated
#             kit gallery (every core component, the ShellFrame demo included). It first runs the SELF-TEST: the
#             gallery with a planted overflow (document and frame) must make the run fail, and summary.mjs --selftest
#             checks that each planted capture was caught; a self-test that passes is red.
#   deployed  workflow_call from deploy-admin-dev.yml after the verified ECS deploy and its smoke, and dispatch from main
#             with base_url: the public pages (login, and the unknown path, which the deployed proxy.ts sends to
#             /login when signed out: pages.ts `deployed`) on the deployed host. Staff pages are not captured there:
#             Booking has no E2E sign-in from CI yet (root ADR 0016 plan, hand steps H4 / H5); the per-PR run covers
#             them on the mocked API.

on:
  # No `paths:` (AA-1008 H3): the Scope step of job `pr` matches the path list, so the check reports on every PR.
  pull_request:
    branches: [main]
  # The merge queue (AA-889) tests each group on a gh-readonly-queue/main/* commit and waits for every required check.
  merge_group:
    types: [checks_requested]
  workflow_call:
    inputs:
      base_url:
        description: "The deployed host to capture"
        required: true
        type: string
      sha:
        description: "The deployed commit"
        required: false
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      base_url:
        description: "Deployed host (https://booking.lumiguides.it.com, dispatch from main); empty = the next start run"
        required: false
        type: string
        default: ""
      pages:
        description: "Comma list of page slugs (frontend/e2e/visual/pages.ts) or all"
        required: false
        type: string
        default: "all"

permissions:
  contents: read

# A PR's newer push cancels its older run; a merge_group run (no PR number, no base_url) has its own run_id group, so
# two queue groups never cancel each other.
concurrency:
  group: visual-${{ github.event_name == 'pull_request' && github.event.pull_request.number || inputs.base_url || github.run_id }}
  cancel-in-progress: true

jobs:
  pr:
    name: Visual (next start, mocked API + kit gallery)
    # S271 (CI minutes): skipped on pull_request (a job-level skip with no `needs` reports "skipped", which passes the
    # required check, so the PR can still enter the queue); the queue group runs it with its Scope step, so the merge
    # queue still checks every frontend change before main. Trade-off: a visual failure is found in the queue, not on
    # the PR; to see it earlier, dispatch this workflow on the PR branch (no base_url).
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.base_url == '') || github.event_name == 'merge_group'
    # Pinned: ubuntu-latest became Ubuntu 26.04 (19/10/2026), where Playwright has no chromium build (S253).
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      # The gated kit gallery route answers only on a KIT_GALLERY=1 server (playwright.config.ts passes it to next start).
      KIT_GALLERY: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      # AA-1008 H3: the old pull_request `paths:` list (frontend/**, this workflow), matched here; renames count by both
      # names. A dispatch runs every step. A diff that cannot be computed runs the full check (never a silent skip).
      # From the repository root: the job's default working directory is frontend/.
      - name: Scope
        id: scope
        working-directory: .
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          GROUP_BASE: ${{ github.event.merge_group.base_sha }}
        run: |
          case "$EVENT" in
            pull_request) BASE=${BASE_REF:+origin/$BASE_REF} ;;
            merge_group) BASE=$GROUP_BASE ;;
            *) echo "run=true" >> "$GITHUB_OUTPUT"; echo "Scope: $EVENT runs every step"; exit 0 ;;
          esac
          if [ -z "$BASE" ] || ! FILES=$(git diff --name-only --no-renames "$BASE...HEAD"); then
            echo "::warning::no base commit, or git diff ${BASE:-(none)}...HEAD failed: running the full visual check"
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          MATCHED=$(printf '%s\n' "$FILES" | grep -E '^(frontend/|\.github/workflows/visual\.yml$)' || true)
          if [ -n "$MATCHED" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Scope: $(printf '%s\n' "$MATCHED" | wc -l) frontend / workflow file(s) changed"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "### Visual — no frontend change (nothing to capture)" >> "$GITHUB_STEP_SUMMARY"
            echo "Scope: no frontend change; every later step is skipped and the check is green"
          fi

      - name: Set up Node 22
        if: steps.scope.outputs.run == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          package-manager-cache: false

      # S273 (workflow_lint WL4): restore on every ref; only the default branch saves this cache
      # (a pull request or merge-queue copy is readable only by that ref).
      - name: Restore npm cache
        if: steps.scope.outputs.run == 'true'
        id: npm-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-${{ runner.arch }}-

      # merge_group has no github.base_ref: the queue group is diffed against its base commit.
      - name: Changed pages
        id: pages
        if: steps.scope.outputs.run == 'true'
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          MERGE_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          PAGES: ${{ inputs.pages }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            SLUGS=$(node --experimental-strip-types --no-warnings e2e/visual/changed-pages.mjs "origin/$BASE_REF" HEAD)
          elif [ "$EVENT" = "merge_group" ]; then
            SLUGS=$(node --experimental-strip-types --no-warnings e2e/visual/changed-pages.mjs "$MERGE_BASE_SHA" HEAD)
          else
            SLUGS=${PAGES:-all}
          fi
          echo "slugs=$SLUGS" >> "$GITHUB_OUTPUT"
          echo "Changed pages: ${SLUGS:-none}"

      - name: Install dependencies and Chromium
        if: steps.scope.outputs.run == 'true'
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Build (next build)
        if: steps.scope.outputs.run == 'true'
        run: npm run build

      # The planted overflow (document and frame) must be caught: the Playwright run must fail and every planted
      # capture must show its overflow in the report. A green self-test means the assertion is broken.
      - name: Self-test (a planted overflow must fail the run)
        if: steps.scope.outputs.run == 'true'
        env:
          VISUAL_SELFTEST: "1"
        run: |
          if npx playwright test --project=visual-1440 --project=visual-390 --reporter=line; then
            echo "::error::the planted-overflow pages passed the visual checks: the overflow assertion is broken"
            exit 1
          fi
          node e2e/visual/summary.mjs --selftest
          rm -rf e2e/visual/results

      - name: Capture and check
        if: steps.scope.outputs.run == 'true'
        env:
          VISUAL_AUTH: all
          VISUAL_GALLERY: "1"
          VISUAL_SLUGS: ${{ steps.pages.outputs.slugs }}
        run: npx playwright test --project=visual-1440 --project=visual-390 --reporter=list

      - name: Summary
        if: always() && steps.scope.outputs.run == 'true'
        env:
          SLUGS: ${{ steps.pages.outputs.slugs }}
        run: |
          mkdir -p e2e/visual/results
          {
            echo "### Visual — next start (mocked API + kit gallery)"
            echo ""
            node e2e/visual/summary.mjs
            echo ""
            echo "Changed pages: \`${SLUGS:-none}\`. Staff pages run on the layout-mock API (fixture data, frozen clock)."
          } | tee e2e/visual/results/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload screenshots and report
        if: always() && steps.scope.outputs.run == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: visual-booking-pr-${{ github.run_id }}
          path: |
            frontend/e2e/visual/results/shots/*.png
            frontend/e2e/visual/results/report.json
          if-no-files-found: warn
          retention-days: 14

  deployed:
    name: Visual (deployed host, public pages)
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name != 'workflow_dispatch' || inputs.base_url != '') && github.event_name != 'pull_request' &&
      github.event_name != 'merge_group'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontend
    env:
      VISUAL_BASE_URL: ${{ inputs.base_url }}
    steps:
      - name: Only the Booking admin host
        working-directory: .
        env:
          URL: ${{ inputs.base_url }}
        run: |
          case "${URL%/}" in
            https://booking.lumiguides.it.com) echo "Visual run on $URL" ;;
            *) echo "::error::base_url must be https://booking.lumiguides.it.com (got $URL)"; exit 1 ;;
          esac

      # Runs only from main (job condition), so the checkout is main's commit. No npm cache after checking out a
      # given ref (cache-poisoning path, CodeQL high, #103 review), like the smoke job of deploy-admin-dev.yml.
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.sha || github.sha }}
          persist-credentials: false

      - name: Set up Node 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Install dependencies and Chromium
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Capture the public pages
        env:
          VISUAL_AUTH: public
          VISUAL_SLUGS: ${{ inputs.pages || 'all' }}
        run: npx playwright test --project=visual-1440 --project=visual-390 --reporter=list --pass-with-no-tests

      - name: Summary
        if: always()
        run: |
          mkdir -p e2e/visual/results
          {
            echo "### Visual — $VISUAL_BASE_URL (public pages)"
            echo ""
            node e2e/visual/summary.mjs
            echo ""
            echo "Staff pages are captured by the per-PR run on the mocked API (no Booking E2E sign-in from CI yet)."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload screenshots and report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: visual-booking-production-${{ github.run_id }}
          path: |
            frontend/e2e/visual/results/shots/*.png
            frontend/e2e/visual/results/report.json
          if-no-files-found: warn
          retention-days: 14
