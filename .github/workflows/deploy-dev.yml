name: Deploy Dev

# Build → push to ECR (immutable git-SHA tag) → new task definition revision (only the image
# swapped) → update the ECS service → wait stable → verify the running image → live smoke
# (root ADR 0004 decision 4). Runtime resources come from AA-CIS-Infra accounts/aa365/booking.tf.
#
# Configuration lives in the GitHub environment `dev` as VARIABLES (none of them is a secret):
#   AWS_ROLE_ARN          OIDC deploy role aa-booking-dev-app-deploy (output of booking.tf). Never the
#                         broad aa-cis-dev-role. While it is unset the deploy job is skipped.
#   AWS_REGION            default us-west-1
#   ECR_REPOSITORY        default aa-booking-dev-api
#   ECS_CLUSTER           default aa-cis-dev-cluster
#   ECS_SERVICE           default aa-booking-dev-api
#   BOOKING_API_BASE_URL  e.g. the execute-api stage URL; the smoke test is skipped while unset
#
# No job guard: Booking has no jobs yet (ADR 0004 decision 8). This workflow never changes the
# service's desired count — scaling 0 → 1 is a separate, approved step.

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-dev.yml"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  config:
    name: Deploy configuration
    runs-on: ubuntu-latest
    environment: dev
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - name: Check AWS_ROLE_ARN
        id: check
        env:
          ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
        run: |
          if [ -z "${ROLE_ARN}" ]; then
            echo "::warning::Variable AWS_ROLE_ARN is not set on environment 'dev' — deploy skipped (AA-CIS-Infra booking.tf not applied yet?)."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    name: Deploy to ECS Dev
    needs: config
    if: needs.config.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    environment: dev
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-west-1' }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY || 'aa-booking-dev-api' }}
      ECS_CLUSTER: ${{ vars.ECS_CLUSTER || 'aa-cis-dev-cluster' }}
      ECS_SERVICE: ${{ vars.ECS_SERVICE || 'aa-booking-dev-api' }}
      BASE_URL: ${{ vars.BOOKING_API_BASE_URL }}
    steps:
      - uses: actions/checkout@v5

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image (git-SHA tag only)
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          set -euo pipefail
          IMAGE="${REGISTRY}/${ECR_REPOSITORY}:${GITHUB_SHA}"
          docker build --build-arg GIT_SHA="${GITHUB_SHA}" -t "$IMAGE" backend
          docker push "$IMAGE"
          echo "DEPLOY_IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Register task definition and update service
        run: |
          set -euo pipefail
          CURRENT_TD=$(aws ecs describe-services --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE" \
            --query 'services[0].taskDefinition' --output text)
          [ -n "$CURRENT_TD" ] && [ "$CURRENT_TD" != "None" ] || { echo "::error::service $ECS_SERVICE not found"; exit 1; }
          echo "current task definition: $CURRENT_TD"
          aws ecs describe-task-definition --task-definition "$CURRENT_TD" --query 'taskDefinition' --output json > /tmp/td.json
          [ "$(jq '.containerDefinitions | length' /tmp/td.json)" = "1" ] || { echo "::error::expected exactly one container"; exit 1; }
          # Only the image changes; every other field stays as Terraform set it.
          jq --arg img "$DEPLOY_IMAGE" \
            'del(.taskDefinitionArn,.revision,.status,.requiresAttributes,.compatibilities,.registeredAt,.registeredBy,.deregisteredAt) | .containerDefinitions[0].image = $img' \
            /tmp/td.json > /tmp/td_new.json
          NEW_TD=$(aws ecs register-task-definition --cli-input-json file:///tmp/td_new.json \
            --query 'taskDefinition.taskDefinitionArn' --output text)
          echo "registered: $NEW_TD"
          aws ecs update-service --cluster "$ECS_CLUSTER" --service "$ECS_SERVICE" \
            --task-definition "$NEW_TD" >/dev/null

      - name: Wait for the service to be stable
        run: aws ecs wait services-stable --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE"

      - name: Verify the running image
        run: |
          set -euo pipefail
          TD=$(aws ecs describe-services --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE" \
            --query 'services[0].taskDefinition' --output text)
          RUNNING=$(aws ecs describe-task-definition --task-definition "$TD" \
            --query 'taskDefinition.containerDefinitions[0].image' --output text)
          echo "service image: $RUNNING"
          [ "$RUNNING" = "$DEPLOY_IMAGE" ] || { echo "::error::service runs $RUNNING, expected $DEPLOY_IMAGE"; exit 1; }
          DESIRED=$(aws ecs describe-services --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE" \
            --query 'services[0].desiredCount' --output text)
          echo "DESIRED_COUNT=$DESIRED" >> "$GITHUB_ENV"

      - name: Smoke test (/booking/health, /booking/health/ready)
        run: |
          set -uo pipefail
          if [ "${DESIRED_COUNT}" = "0" ]; then
            echo "::warning::desired count is 0 — no task is running, smoke skipped (scale to 1 is a separate approved step)."
            exit 0
          fi
          if [ -z "${BASE_URL}" ]; then
            echo "::warning::Variable BOOKING_API_BASE_URL is not set — smoke skipped."
            exit 0
          fi
          BASE="${BASE_URL%/}"
          fail=0
          code=$(curl -s --max-time 20 -o /tmp/health.json -w "%{http_code}" "$BASE/booking/health")
          cat /tmp/health.json; echo
          if [ "$code" != "200" ] || ! jq -e --arg sha "$GITHUB_SHA" '.status == "ok" and .git_sha == $sha' /tmp/health.json >/dev/null; then
            echo "::error::/booking/health -> $code (expected 200 and git_sha $GITHUB_SHA)"; fail=1
          fi
          code=$(curl -s --max-time 20 -o /tmp/ready.json -w "%{http_code}" "$BASE/booking/health/ready")
          cat /tmp/ready.json; echo
          if [ "$code" != "200" ] || ! jq -e '.db == "ok" and (.schema_version | startswith("bk-"))' /tmp/ready.json >/dev/null; then
            echo "::error::/booking/health/ready -> $code (expected 200, db ok, schema_version bk-NNN)"; fail=1
          fi
          [ "$fail" = "0" ] && echo "Smoke passed" || exit 1
