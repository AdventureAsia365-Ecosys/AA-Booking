name: Deploy Dev

# Build → push to ECR (immutable git-SHA tag) → new task definition revision (only the image
# swapped) → update the ECS service → wait stable → post-deploy verify (root ADR 0004 decision 4).
# Runtime resources come from AA-CIS-Infra accounts/aa365/booking.tf.
#
# Configuration lives in the GitHub environment `dev` as VARIABLES (none of them is a secret):
#   AWS_ROLE_ARN          OIDC deploy role aa-booking-dev-app-deploy (output of booking.tf). Never the
#                         broad aa-cis-dev-role. While it is unset the run is red (AA-993: the `config` job fails,
#                         so nothing is deployed and nothing reads as green).
#   AWS_REGION            default us-west-1
#   ECR_REPOSITORY        default aa-booking-dev-api
#   ECS_CLUSTER           default aa-cis-dev-cluster
#   ECS_SERVICE           default aa-booking-dev-api
#   ECS_TASK_FAMILY       default aa-booking-dev-api (the Terraform task definition family)
#   BOOKING_API_BASE_URL  default https://api-booking.lumiguides.it.com (the Dev custom domain); used by the
#                         deploy gate and the post-deploy verify
#
# Job guard (AA-751 B3/B4, the `preflight` job; meaning changed by AA-993 G5, design D1.4): since G5 the guard
# blocks only while a row of a DEPLOY_BLOCKING_KINDS kind (app/jobs/kinds.py: the retention kinds, which keep no
# checkpoint) is running, or queued and due within 15 min (this job runs before the build, so the old task would
# claim it before its SIGTERM). Any other running job is released on shutdown and re-claimed by the new task, and
# other queued jobs wait for whichever task is live (AA-993 G4/G5). Before building, preflight:
#   1. reads the service's running/pending/desired task counts with the deploy role. All 0 → nothing can be
#      interrupted: pass. None running but one pending or desired (a task starting: crash replacement, a fresh
#      0 → 1 scale) → blocked, since that task would claim queued jobs during the build and then be replaced.
#   2. otherwise mints this run's GitHub OIDC token (audience aa-booking-deploy-gate; the job needs
#      `id-token: write` and `environment: dev`) and calls GET <BASE_URL>/booking/ops/deploy-gate.
#      Booking accepts only a token from this workflow file on main, environment dev, event push or
#      workflow_dispatch (app/auth/ci.py). No secret is involved.
#   3. safe_to_deploy true → pass (the gate's blocked_by is empty). The other queued/running counts are information
#      only; kinds in DEPLOY_GATE_EXEMPT (bk_inquiry_pull, always queued; bk_noop_sleep, test-only) are left out.
#   4. not safe, or the gate is unreachable / not JSON (fail closed) → the deploy is blocked, unless a
#      workflow_dispatch run gives `override_running_jobs` (Nghiệp only, with the reason): then a warning
#      names the reason and the count, and the deploy goes on.
# The logic is .github/scripts/booking-deploy-preflight.sh, tested with stub aws/curl by
# backend/tests/unit/test_deploy_preflight_script.py (Unit Tests check).
# Pushes that only change backend/tests/** or backend/pyproject.toml do not deploy (nothing in the image changes; the
# image copies only requirements.txt and app/). A merged release PR (AA-891: CHANGELOG.md, .release-please-manifest.json,
# the pyproject version) therefore never deploys by itself.
#
# Release version (AA-891): the build reads it from .release-please-manifest.json and bakes it in as APP_VERSION, the
# same way as GIT_SHA; /booking/health returns it as "version" and the post-deploy verify checks it.
#
# Post-deploy verify (AA-993 V2, ADR 0016 D3): the `verify` job calls post-deploy-verify.yml (also dispatchable with
# expected_sha; script .github/scripts/post_deploy_verify.sh, rows .github/verify/booking.rows): ECS rollout COMPLETED,
# desired >= 1 (0 is red: this workflow never scales up), the running image = the built one, /booking/health on this
# commit + version, /booking/health/ready on a schema >= the newest bk-NNN this commit needs. The `result` job
# ("Deploy Dev result") is red when any job did not succeed, skipped included: read that one.
#
# The base task definition is the family's latest ACTIVE revision, so a redeploy of an older commit keeps
# the latest Terraform env/secrets: revert config in Terraform. This workflow never changes the service's
# desired count; scaling 0 → 1 is a separate step (until then the verify, and so the run, is red).

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "!backend/tests/**"
      - "!backend/pyproject.toml"
      - ".github/workflows/deploy-dev.yml"
      - ".github/scripts/booking-deploy-preflight.sh"
  workflow_dispatch:
    inputs:
      override_running_jobs:
        description: "Nghiệp only — reason to deploy anyway while a deploy-blocking booking.job row runs or is due (AA-993 G5). Leave empty to respect the guard."
        required: false
        type: string

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  config:
    name: Deploy configuration
    runs-on: ubuntu-latest
    environment: dev
    steps:
      # AA-993: red, not a skip. It used to output enabled=false and skip every job, which GitHub shows green.
      - name: Check AWS_ROLE_ARN
        env:
          ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
        run: |
          if [ -z "${ROLE_ARN}" ]; then
            echo "::error::Variable AWS_ROLE_ARN is not set on environment 'dev': nothing can be deployed or verified (AA-CIS-Infra booking.tf output)."
            exit 1
          fi

  preflight:
    name: Pre-deploy job guard
    needs: config
    runs-on: ubuntu-latest
    environment: dev
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-west-1' }}
      ECS_CLUSTER: ${{ vars.ECS_CLUSTER || 'aa-cis-dev-cluster' }}
      ECS_SERVICE: ${{ vars.ECS_SERVICE || 'aa-booking-dev-api' }}
      BASE_URL: ${{ vars.BOOKING_API_BASE_URL || 'https://api-booking.lumiguides.it.com' }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/scripts

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Check for a running or due deploy-blocking booking.job row
        env:
          OVERRIDE: ${{ inputs.override_running_jobs }}
          GATE_AUDIENCE: aa-booking-deploy-gate
        run: bash .github/scripts/booking-deploy-preflight.sh

  deploy:
    name: Deploy to ECS Dev
    needs: [config, preflight]
    runs-on: ubuntu-latest
    environment: dev
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-west-1' }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY || 'aa-booking-dev-api' }}
      ECS_CLUSTER: ${{ vars.ECS_CLUSTER || 'aa-cis-dev-cluster' }}
      ECS_SERVICE: ${{ vars.ECS_SERVICE || 'aa-booking-dev-api' }}
      ECS_TASK_FAMILY: ${{ vars.ECS_TASK_FAMILY || 'aa-booking-dev-api' }}
      BASE_URL: ${{ vars.BOOKING_API_BASE_URL || 'https://api-booking.lumiguides.it.com' }}
    steps:
      - uses: actions/checkout@v7

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image (git-SHA tag only)
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          set -euo pipefail
          IMAGE="${REGISTRY}/${ECR_REPOSITORY}:${GITHUB_SHA}"
          APP_VERSION=$(jq -r '."."' .release-please-manifest.json)
          [[ "$APP_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::bad version in the manifest: $APP_VERSION"; exit 1; }
          # The repository is IMMUTABLE (AA-869): a re-deploy of the same commit (a manual dispatch after a
          # Terraform change to env/secrets) reuses the image already pushed for this SHA instead of failing
          # on the push. `docker manifest inspect` needs only the pull rights the ECR login already gives.
          if docker manifest inspect "$IMAGE" >/dev/null 2>&1; then
            echo "image for ${GITHUB_SHA} already in ECR: reusing it (no build, no push)"
          else
            docker build --build-arg GIT_SHA="${GITHUB_SHA}" --build-arg APP_VERSION="${APP_VERSION}" -t "$IMAGE" backend
            docker push "$IMAGE"
          fi
          echo "DEPLOY_IMAGE=$IMAGE" >> "$GITHUB_ENV"
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"

      - name: Register task definition and update service
        run: |
          set -euo pipefail
          # Base = the LATEST ACTIVE revision of the family, not the revision the service runs: a Terraform change
          # to the task definition (booking.tf: environment, secrets, roles, size) registers a new revision that
          # the service ignores (ignore_changes), and only this copy carries it to the running task (AA-811,
          # same rule as the CIS deploy).
          aws ecs describe-services --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE" \
            --query 'services[0].serviceName' --output text | grep -qx "$ECS_SERVICE" \
            || { echo "::error::service $ECS_SERVICE not found"; exit 1; }
          aws ecs describe-task-definition --task-definition "$ECS_TASK_FAMILY" --query 'taskDefinition' --output json > /tmp/td.json
          # family:revision only: the full ARN names the AWS account (public logs).
          echo "base task definition: $(jq -r '.taskDefinitionArn | split("/") | last' /tmp/td.json)"
          [ "$(jq '.containerDefinitions | length' /tmp/td.json)" = "1" ] || { echo "::error::expected exactly one container"; exit 1; }
          # Only the image changes; every other field stays as Terraform set it.
          jq --arg img "$DEPLOY_IMAGE" \
            'del(.taskDefinitionArn,.revision,.status,.requiresAttributes,.compatibilities,.registeredAt,.registeredBy,.deregisteredAt) | .containerDefinitions[0].image = $img' \
            /tmp/td.json > /tmp/td_new.json
          NEW_TD=$(aws ecs register-task-definition --cli-input-json file:///tmp/td_new.json \
            --query 'taskDefinition.taskDefinitionArn' --output text)
          echo "registered: ${NEW_TD##*/}"
          aws ecs update-service --cluster "$ECS_CLUSTER" --service "$ECS_SERVICE" \
            --task-definition "$NEW_TD" >/dev/null

      - name: Wait for the service to be stable
        run: aws ecs wait services-stable --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE"

  # AA-993 V2 (ADR 0016 D3) — the post-deploy checks (running image, desired count, /booking/health and
  # /booking/health/ready) moved to post-deploy-verify.yml, which is also dispatchable on its own. It runs only when
  # `deploy` succeeded; `result` below turns a skipped or failed verify red.
  verify:
    name: Post-deploy verify
    needs: deploy
    uses: ./.github/workflows/post-deploy-verify.yml
    with:
      expected_sha: ${{ github.sha }}
      from_deploy: true

  # AA-993 — the run's verdict. GitHub shows a skipped job grey, not red, so without this a failed config/preflight/
  # deploy (verify then skips) could look like "nothing to verify". Every job here must succeed; skipped, failed or
  # cancelled is red on every event (no job in this workflow is conditional).
  result:
    name: Deploy Dev result
    runs-on: ubuntu-latest
    if: always()
    needs: [config, preflight, deploy, verify]
    steps:
      - name: Every job succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
          EVENT: ${{ github.event_name }}
        run: |
          set -uo pipefail
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          BAD=$(echo "$NEEDS" | jq -r '[to_entries[] | select(.value.result != "success") | "\(.key)=\(.value.result)"] | join(", ")')
          if [ -n "$BAD" ] || [ "$(echo "$NEEDS" | jq 'length')" -lt 4 ]; then
            echo "::error::Deploy Dev ($EVENT) is not verified: ${BAD:-a job result is missing}"
            exit 1
          fi
          echo "Deploy Dev ($EVENT): deployed and verified."
