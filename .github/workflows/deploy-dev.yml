name: Deploy Dev

# Build → push to ECR (immutable git-SHA tag) → new task definition revision (only the image
# swapped) → update the ECS service → wait stable → post-deploy verify (root ADR 0004 decision 4).
# Runtime resources come from AA-CIS-Infra accounts/aa365/booking.tf.
#
# Configuration lives in the GitHub environment `dev` as VARIABLES (none of them is a secret):
#   AWS_ROLE_ARN          OIDC deploy role aa-booking-dev-app-deploy (output of booking.tf). Never the
#                         broad aa-cis-dev-role. While it is unset the run is red (AA-993: the `config` job fails,
#                         so nothing is deployed and nothing reads as green).
#   AWS_REGION            default us-west-1
#   ECR_REPOSITORY        default aa-booking-dev-api
#   ECS_CLUSTER           default aa-cis-dev-cluster
#   ECS_SERVICE           default aa-booking-dev-api
#   ECS_TASK_FAMILY       default aa-booking-dev-api (the Terraform task definition family)
#   BOOKING_API_BASE_URL  default https://api-booking.lumiguides.it.com (the Dev custom domain); used by the
#                         deploy gate and the post-deploy verify
#
# Job guard (AA-751 B3/B4, the `preflight` job; meaning changed by AA-993 G5, design D1.4): since G5 the guard
# blocks only while a row of a DEPLOY_BLOCKING_KINDS kind (app/jobs/kinds.py: the retention kinds, which keep no
# checkpoint) is running, or queued and due within 15 min (this job runs before the build, so the old task would
# claim it before its SIGTERM). Any other running job is released on shutdown and re-claimed by the new task, and
# other queued jobs wait for whichever task is live (AA-993 G4/G5). Before building, preflight:
#   1. reads the service's running/pending/desired task counts with the deploy role. All 0 → nothing can be
#      interrupted: pass. None running but one pending or desired (a task starting: crash replacement, a fresh
#      0 → 1 scale) → blocked, since that task would claim queued jobs during the build and then be replaced.
#   2. otherwise mints this run's GitHub OIDC token (audience aa-booking-deploy-gate; the job needs
#      `id-token: write` and `environment: dev`) and calls GET <BASE_URL>/booking/ops/deploy-gate.
#      Booking accepts only a token from this workflow file on main, environment dev, event push or
#      workflow_dispatch (app/auth/ci.py). No secret is involved.
#   3. safe_to_deploy true → pass (the gate's blocked_by is empty). The other queued/running counts are information
#      only; kinds in DEPLOY_GATE_EXEMPT (bk_noop_sleep, test-only) are left out.
#   4. not safe, or the gate is unreachable / not JSON (fail closed) → the deploy is blocked, unless a
#      workflow_dispatch run gives `override_running_jobs` (Nghiệp only, with the reason): then a warning
#      names the reason and the count, and the deploy goes on.
# The logic is .github/scripts/booking-deploy-preflight.sh, tested with stub aws/curl by
# backend/tests/unit/test_deploy_preflight_script.py (Unit Tests check).
# Pushes that only change backend/tests/** or backend/pyproject.toml do not deploy (nothing in the image changes; the
# image copies only requirements.txt and app/). A merged release PR (AA-891: CHANGELOG.md, .release-please-manifest.json,
# the pyproject version) therefore never deploys by itself.
#
# Release version (AA-891): the build reads it from .release-please-manifest.json and bakes it in as APP_VERSION, the
# same way as GIT_SHA; /booking/health returns it as "version" and the post-deploy verify checks it.
#
# Post-deploy verify (AA-993 V2, ADR 0016 D3): the `verify` job calls post-deploy-verify.yml (also dispatchable with
# expected_sha; script .github/scripts/post_deploy_verify.sh, rows .github/verify/booking.rows): ECS rollout COMPLETED,
# desired >= 1 (0 is red: this workflow never scales up), the running image = the built one, /booking/health on this
# commit + version, /booking/health/ready on a schema >= the newest bk-NNN this commit needs. The `result` job
# ("Deploy Dev result") is red when any job did not succeed, skipped included: read that one.
#
# Schema gate (AA-993 M4b, root ADR 0017 d7; the `schema-gate` job, before the job guard and the build): the commit's
# required bk-NNN keys (REQUIRED_SCHEMA_VERSIONS of backend/app/db.py, plus every migrations/ file at or below the
# newest one) must be in /booking/health/ready `registered_keys` on Dev, and the AA-CIS-Infra Migration Apply run that
# applied files last must have apply and its blocking Isolation Probe green. It polls up to SCHEMA_GATE_TIMEOUT_S
# (repo variable, default 2400 s: an expand file merged in the same PR is copied by the migration-sync bot and applied
# by Migration Apply meanwhile), then fails BEFORE the rollout. No AWS and no secret: the readiness URL and the Infra
# Actions API are public. With DB_AUTO_APPLY off it only checks that the keys are registered, which the manual DB
# Migrate flow already guarantees (apply within the window, or re-run this workflow after the apply). Logic:
# .github/scripts/schema_gate.py (backend/tests/unit/test_schema_gate_script.py).
#
# The base task definition is the family's latest ACTIVE revision, so a redeploy of an older commit keeps
# the latest Terraform env/secrets: revert config in Terraform. This workflow never changes the service's
# desired count; scaling 0 → 1 is a separate step (until then the verify, and so the run, is red).

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "!backend/tests/**"
      - "!backend/pyproject.toml"
      - ".github/workflows/deploy-dev.yml"
      - ".github/scripts/booking-deploy-preflight.sh"
      - ".github/scripts/schema_gate.py"
  workflow_dispatch:
    inputs:
      override_running_jobs:
        description: "Nghiệp only — reason to deploy anyway while a deploy-blocking booking.job row runs or is due (AA-993 G5). Leave empty to respect the guard."
        required: false
        type: string
      drill_force_smoke_fail:
        description: "AA-1193 drill — deploy normally, then force the post-deploy verify red so the automatic rollback runs. Needs main ahead of what Dev runs (merge a commit that does not deploy first)."
        required: false
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  config:
    name: Deploy configuration
    runs-on: ubuntu-latest
    environment: dev
    steps:
      # AA-993: red, not a skip. It used to output enabled=false and skip every job, which GitHub shows green.
      - name: Check AWS_ROLE_ARN
        env:
          ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
        run: |
          if [ -z "${ROLE_ARN}" ]; then
            echo "::error::Variable AWS_ROLE_ARN is not set on environment 'dev': nothing can be deployed or verified (AA-CIS-Infra booking.tf output)."
            exit 1
          fi

  # AA-993 M4b: wait (bounded) for the schema this commit needs, before the job guard reads the live jobs (so its
  # answer is fresh when the rollout starts). Runs on the deployed commit's own tree.
  schema-gate:
    name: Schema gate
    needs: config
    runs-on: ubuntu-latest
    environment: dev
    # The script stops at SCHEMA_GATE_TIMEOUT_S (default 2400 s, at most 2580 s); the job limit is the backstop.
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            .github/scripts
            backend/app/db.py
            migrations
          sparse-checkout-cone-mode: false

      - name: Wait until Dev has every key this commit needs
        env:
          GH_TOKEN: ${{ github.token }}
          SCHEMA_GATE_TIMEOUT_S: ${{ vars.SCHEMA_GATE_TIMEOUT_S }}
          BASE_URL: ${{ vars.BOOKING_API_BASE_URL || 'https://api-booking.lumiguides.it.com' }}
        run: |
          python3 .github/scripts/schema_gate.py --app booking --readiness-file backend/app/db.py \
            --migrations-dir migrations --ready-url "${BASE_URL%/}/booking/health/ready"

  preflight:
    name: Pre-deploy job guard
    needs: [config, schema-gate]
    runs-on: ubuntu-latest
    environment: dev
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-west-1' }}
      ECS_CLUSTER: ${{ vars.ECS_CLUSTER || 'aa-cis-dev-cluster' }}
      ECS_SERVICE: ${{ vars.ECS_SERVICE || 'aa-booking-dev-api' }}
      BASE_URL: ${{ vars.BOOKING_API_BASE_URL || 'https://api-booking.lumiguides.it.com' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/scripts

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Check for a running or due deploy-blocking booking.job row
        env:
          OVERRIDE: ${{ inputs.override_running_jobs }}
          GATE_AUDIENCE: aa-booking-deploy-gate
        run: bash .github/scripts/booking-deploy-preflight.sh

  deploy:
    name: Deploy to ECS Dev
    needs: [config, schema-gate, preflight]
    runs-on: ubuntu-latest
    environment: dev
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-west-1' }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY || 'aa-booking-dev-api' }}
      ECS_CLUSTER: ${{ vars.ECS_CLUSTER || 'aa-cis-dev-cluster' }}
      ECS_SERVICE: ${{ vars.ECS_SERVICE || 'aa-booking-dev-api' }}
      ECS_TASK_FAMILY: ${{ vars.ECS_TASK_FAMILY || 'aa-booking-dev-api' }}
      BASE_URL: ${{ vars.BOOKING_API_BASE_URL || 'https://api-booking.lumiguides.it.com' }}
    # AA-1193: the revision the service ran before this deploy (empty = unknown or unsafe: never rolled back).
    outputs:
      previous_td: ${{ steps.before.outputs.previous_td }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@7290e214a610b32bc0eef81748948b6d466a8783 # v2.2.0

      - name: Build and push image (git-SHA tag only)
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          set -euo pipefail
          IMAGE="${REGISTRY}/${ECR_REPOSITORY}:${GITHUB_SHA}"
          APP_VERSION=$(jq -r '."."' .release-please-manifest.json)
          [[ "$APP_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::bad version in the manifest: $APP_VERSION"; exit 1; }
          # The repository is IMMUTABLE (AA-869): a re-deploy of the same commit (a manual dispatch after a
          # Terraform change to env/secrets) reuses the image already pushed for this SHA instead of failing
          # on the push. `docker manifest inspect` needs only the pull rights the ECR login already gives.
          if docker manifest inspect "$IMAGE" >/dev/null 2>&1; then
            echo "image for ${GITHUB_SHA} already in ECR: reusing it (no build, no push)"
          else
            # --pull and no layer cache (S294): the base tag and the apt upgrade layer are always read fresh.
            docker build --pull --build-arg GIT_SHA="${GITHUB_SHA}" --build-arg APP_VERSION="${APP_VERSION}" -t "$IMAGE" backend
            docker push "$IMAGE"
          fi
          echo "DEPLOY_IMAGE=$IMAGE" >> "$GITHUB_ENV"
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"

      # AA-1193 (same mechanism as AA-1119 for the web deploys): record what runs now, before update-service, so a red
      # post-deploy verify can roll back to it. Empty when the service is not settled or runs a Terraform template
      # revision (then `rollback` refuses). Drill (input drill_force_smoke_fail): refused here, before the roll, when Dev
      # already runs this commit (nothing older to go back to).
      - name: Record the revision before this deploy (rollback target)
        id: before
        env:
          DRILL: ${{ inputs.drill_force_smoke_fail == true }}
        run: |
          set -euo pipefail
          out=$(python3 .github/scripts/ecs_smoke_rollback.py previous --cluster "$ECS_CLUSTER" --service "$ECS_SERVICE")
          echo "$out" >> "$GITHUB_OUTPUT"
          echo "$out"
          if [ "$DRILL" = "true" ] && grep -qx "previous_tag=${GITHUB_SHA}" <<<"$out"; then
            echo "::error::drill: Dev already runs this commit, so there is nothing older to roll back to. Merge a commit that does not deploy (docs only) and dispatch the drill again."
            exit 1
          fi

      - name: Register task definition and update service
        run: |
          set -euo pipefail
          # Base = the LATEST ACTIVE revision of the family, not the revision the service runs: a Terraform change
          # to the task definition (booking.tf: environment, secrets, roles, size) registers a new revision that
          # the service ignores (ignore_changes), and only this copy carries it to the running task (AA-811,
          # same rule as the CIS deploy).
          aws ecs describe-services --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE" \
            --query 'services[0].serviceName' --output text | grep -qx "$ECS_SERVICE" \
            || { echo "::error::service $ECS_SERVICE not found"; exit 1; }
          aws ecs describe-task-definition --task-definition "$ECS_TASK_FAMILY" --query 'taskDefinition' --output json > /tmp/td.json
          # family:revision only: the full ARN names the AWS account (public logs).
          echo "base task definition: $(jq -r '.taskDefinitionArn | split("/") | last' /tmp/td.json)"
          [ "$(jq '.containerDefinitions | length' /tmp/td.json)" = "1" ] || { echo "::error::expected exactly one container"; exit 1; }
          # Only the image changes; every other field stays as Terraform set it.
          jq --arg img "$DEPLOY_IMAGE" \
            'del(.taskDefinitionArn,.revision,.status,.requiresAttributes,.compatibilities,.registeredAt,.registeredBy,.deregisteredAt) | .containerDefinitions[0].image = $img' \
            /tmp/td.json > /tmp/td_new.json
          NEW_TD=$(aws ecs register-task-definition --cli-input-json file:///tmp/td_new.json \
            --query 'taskDefinition.taskDefinitionArn' --output text)
          echo "registered: ${NEW_TD##*/}"
          aws ecs update-service --cluster "$ECS_CLUSTER" --service "$ECS_SERVICE" \
            --task-definition "$NEW_TD" >/dev/null

      - name: Wait for the service to be stable
        run: aws ecs wait services-stable --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE"

  # AA-993 V2 (ADR 0016 D3) — the post-deploy checks (running image, desired count, /booking/health and
  # /booking/health/ready) moved to post-deploy-verify.yml, which is also dispatchable on its own. It runs only when
  # `deploy` succeeded; `result` below turns a skipped or failed verify red.
  verify:
    name: Post-deploy verify
    needs: deploy
    uses: ./.github/workflows/post-deploy-verify.yml
    with:
      expected_sha: ${{ github.sha }}
      from_deploy: true
      # AA-1193 drill: the verify runs every real check, then turns red on purpose (row drill-forced-fail).
      drill_force_fail: ${{ inputs.drill_force_smoke_fail == true }}

  # AA-1193 (S295 Well-Architected review, OPS06): a red post-deploy verify must not leave the bad build serving. When
  # `verify` failed after a successful deploy, move the service back to the revision recorded before the deploy
  # (.github/scripts/ecs_api_rollback.py over the AA-1119 safety rules of ecs_smoke_rollback.py), then /booking/health
  # must answer the previous commit. Same deploy gate as the deploy (.github/scripts/booking-deploy-preflight.sh): a running or
  # due deploy-blocking job holds the rollback, unless the dispatch gave an override reason. Refused or held = nothing
  # changed. Then one message on the alerts topic (the failing checks, the outcome) and the deploy-smoke-red issue
  # (`report`). Never a loop: an update-service to an existing revision builds and pushes nothing and starts no
  # workflow. The run stays red (`result`); fix forward on main.
  rollback:
    name: Roll back after a red post-deploy verify
    needs: [deploy, verify]
    if: >-
      always() && github.ref == 'refs/heads/main'
      && needs.deploy.result == 'success' && needs.verify.result == 'failure'
    runs-on: ubuntu-latest
    environment: dev
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-west-1' }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY || 'aa-booking-dev-api' }}
      ECS_CLUSTER: ${{ vars.ECS_CLUSTER || 'aa-cis-dev-cluster' }}
      ECS_SERVICE: ${{ vars.ECS_SERVICE || 'aa-booking-dev-api' }}
      BASE_URL: ${{ vars.BOOKING_API_BASE_URL || 'https://api-booking.lumiguides.it.com' }}
    outputs:
      outcome: ${{ steps.rollback.outputs.outcome }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          mask-aws-account-id: true

      - name: Roll back to the revision before this deploy
        id: rollback
        env:
          OVERRIDE: ${{ inputs.override_running_jobs }}
          GATE_AUDIENCE: aa-booking-deploy-gate
          PREVIOUS_TD: ${{ needs.deploy.outputs.previous_td }}
        run: |
          set -uo pipefail
          if bash .github/scripts/booking-deploy-preflight.sh > /tmp/gate.log 2>&1; then gate=open; else gate=held; fi
          cat /tmp/gate.log
          if [ "$gate" = "held" ]; then
            reason=$(grep -m1 '^::error::' /tmp/gate.log | sed 's/^::error::Deploy blocked: //' | cut -c1-200)
            outcome="not rolled back (held by the deploy gate: ${reason:-blocked}); roll back by hand once idle (root runbook rollback-booking.md)"
            status=3
          else
            python3 .github/scripts/ecs_api_rollback.py rollback --cluster "$ECS_CLUSTER" --repository "$ECR_REPOSITORY" \
              --deployed-tag "$GITHUB_SHA" --target "${ECS_SERVICE},,${PREVIOUS_TD}" \
              --health-url "${BASE_URL%/}/booking/health" --apply > /tmp/rollback.out 2> /tmp/rollback.log
            status=$?
            cat /tmp/rollback.log
            outcome=$(sed -n 's/^outcome=//p' /tmp/rollback.out)
            outcome="${outcome:-rollback FAILED (exit $status)}"
          fi
          printf '%s' "$outcome" > /tmp/outcome.txt
          echo "outcome=$outcome" >> "$GITHUB_OUTPUT"
          echo "- $outcome" >> "$GITHUB_STEP_SUMMARY"
          # Refused or held is a safe outcome (nothing changed); a failed rollback is red.
          [ "$status" = 0 ] || [ "$status" = 3 ]

      # The alerts SNS topic (the ops topic of every alarm), read from the task definition's ALERTS_TOPIC_ARN; the
      # deploy role needs sns:Publish on it (AA-CIS-Infra). Not sent = a warning: the issue below still opens.
      - name: Alert the ops topic
        if: always()
        env:
          FAILED_CHECKS: ${{ needs.verify.outputs.failed_checks }}
          DRILL: ${{ inputs.drill_force_smoke_fail == true }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -uo pipefail
          outcome=$(cat /tmp/outcome.txt 2>/dev/null || echo "the rollback step did not finish (read the run)")
          extra=()
          [ "$DRILL" = "true" ] && extra+=(--drill)
          python3 .github/scripts/ecs_api_rollback.py alert --cluster "$ECS_CLUSTER" --service "$ECS_SERVICE" \
            --app "Booking api" --commit "$GITHUB_SHA" --failed-checks "$FAILED_CHECKS" \
            --outcome "$outcome" --run-url "$RUN_URL" "${extra[@]}" --apply
          status=$?
          [ "$status" != 4 ] || echo "::warning::the ops alert was not sent (see the log above); the deploy-smoke-red issue still opens"
          [ "$status" = 0 ] || [ "$status" = 4 ]

  # AA-1193: one open issue labelled deploy-smoke-red per workflow while its post-deploy verify is red on main (opened,
  # then commented on), closed by the next verified deploy. Same job as the web deploy workflows (AA-1119). Only this
  # job writes, and only issues; no checkout.
  report:
    name: Report a red post-deploy verify (issue)
    needs: [deploy, verify, rollback]
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && needs.deploy.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TITLE: "Deploy Dev: post-deploy verify is red"
      VERIFY: ${{ needs.verify.result }}
      FAILED_CHECKS: ${{ needs.verify.outputs.failed_checks }}
      OUTCOME: ${{ needs.rollback.outputs.outcome || needs.rollback.result }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Open, comment on or close the deploy-smoke-red issue
        run: |
          set -euo pipefail
          N=$(gh issue list --label deploy-smoke-red --state open --limit 50 --json number,title \
            | jq -r --arg t "$TITLE" '[.[] | select(.title == $t)][0].number // empty')
          if [ "$VERIFY" = "success" ]; then
            if [ -n "$N" ]; then
              gh issue close "$N" --comment "Verified again on ${GITHUB_SHA::7}: $RUN_URL"
              echo "- post-deploy verify green: closed #$N" >> "$GITHUB_STEP_SUMMARY"
            fi
            exit 0
          fi
          BODY="Deploy Dev on \`${GITHUB_SHA::7}\`: verify **$VERIFY** (failing checks: ${FAILED_CHECKS:-see the run}). Rollback: ${OUTCOME:-not run}.
          Run: $RUN_URL

          Read the failed job first. A rollback leaves main ahead of what runs: fix forward (revert or fix on main).
          Runbook: docs/ops/runbooks/rollback-booking.md in the root repo. The next verified deploy closes this issue."
          if [ -n "$N" ]; then
            gh issue comment "$N" --body "$BODY"
          else
            gh label create deploy-smoke-red --color B60205 --force \
              --description "A post-deploy verify or smoke is red on main (deploy workflows, AA-1119)"
            N=$(gh issue create --title "$TITLE" --label deploy-smoke-red --body "$BODY" | sed -nE 's#.*/issues/([0-9]+)$#\1#p')
          fi
          echo "::warning::post-deploy verify red: issue #$N (label deploy-smoke-red)"
          echo "- post-deploy verify red: issue #$N (label deploy-smoke-red)" >> "$GITHUB_STEP_SUMMARY"

  # AA-993 — the run's verdict. GitHub shows a skipped job grey, not red, so without this a failed config/preflight/
  # deploy (verify then skips) could look like "nothing to verify". Every job here must succeed; skipped, failed or
  # cancelled is red on every event (no job it waits on is conditional; `rollback` and `report` (AA-1193) are, and
  # `result` does not wait on them: a rolled-back run stays red through `verify`).
  result:
    name: Deploy Dev result
    runs-on: ubuntu-latest
    if: always()
    needs: [config, schema-gate, preflight, deploy, verify]
    steps:
      - name: Every job succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
          EVENT: ${{ github.event_name }}
        run: |
          set -uo pipefail
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          BAD=$(echo "$NEEDS" | jq -r '[to_entries[] | select(.value.result != "success") | "\(.key)=\(.value.result)"] | join(", ")')
          if [ -n "$BAD" ] || [ "$(echo "$NEEDS" | jq 'length')" -lt 5 ]; then
            echo "::error::Deploy Dev ($EVENT) is not verified: ${BAD:-a job result is missing}"
            exit 1
          fi
          echo "Deploy Dev ($EVENT): deployed and verified."
