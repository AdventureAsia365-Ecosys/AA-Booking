name: Vercel Deploy

# S241 — the frontend's Vercel deployments are created HERE, not by the Vercel Git integration.
# `frontend/vercel.json` sets `git.deploymentEnabled: false`, so a push to any branch no longer makes
# a deployment by itself. Why: the Hobby team cap is ~100 deployments / 24 h for the whole team (all
# 3 projects), and deployments CANCELED by the Ignored Build Step still count. Vercel's "skip
# unaffected projects" needs npm workspaces, so it cannot help here.
#
# Only PRs / pushes to main that touch `frontend/**` (or this file) deploy:
#   pull_request            → preview of the PR head commit (+ one PR comment)
#   push to main            → production
#   workflow_dispatch       → preview or production (production only from main)
#   workflow_dispatch with alias_only_url → no deployment; only re-points the fixed Preview host
#
# AA-911 (root ADR 0006a A11) — staff sign-in on previews: booking-preview.lumiguides.it.com is the ONE
# Preview host registered as a Cognito callback. Job `preview-alias` points it at a preview deployment
# (`vercel alias set`, which creates no deployment and does not count against the Hobby cap) only when:
#   - the PR carries the label `preview-signin` when its preview deploys (opt-in, so ~10 parallel agent
#     PRs do not keep moving it). Adding that label triggers one run (`labeled`), which is one more
#     deployment against the Hobby cap; prefer the dispatch below when a fresh preview already exists, or
#   - the workflow is dispatched FROM main with alias_only_url=<https://aa-booking-admin-….vercel.app>
#     (main only: an old branch would run its own old copy of this workflow with the repo secrets).
# Before aliasing, the Vercel REST API must confirm the deployment belongs to this project, is not a
# production deployment and is READY. Runbook: root docs/ops/runbooks/preview-staff-sign-in.md.
#
# The deploy runs from the REPO ROOT: the project's Root Directory setting is `frontend`, so Vercel
# builds `frontend/` remotely with the project's own env vars (no `vercel pull` / prebuilt here).
#
# Needs the repo secret VERCEL_TOKEN (a Vercel token scoped to the team). While it is empty the job
# FAILS (red) on every target — nothing else deploys the frontend, so a silent green skip would hide a
# production that stopped updating. Fork PRs and Dependabot runs (AA-903) get no secrets and are
# skipped by the job `if:` instead.
# The org / project ids are not secrets.
#
# AA-993 V5 — production only: job `smoke` runs the Playwright project `smoke-public` (frontend/e2e/smoke-public/)
# against the public production host PRODUCTION_HOST once the deploy succeeded: /login answers 200 and renders, no
# console error, no failed same-origin request, the next.config.ts security headers. Signed out, no secret. The
# screenshot is uploaded as an artifact. Job `result` is the run's verdict: on a production run it is red unless
# deploy AND smoke succeeded (a skipped smoke is red too); previews, alias-only and no-op label runs are not gated
# by it (the deploy job's own status stands, as before).

on:
  pull_request:
    # `labeled` (AA-911): adding the label preview-signin deploys and aliases at once. Any other label is
    # skipped by the deploy job `if:` (a skipped job is no deployment).
    types: [opened, synchronize, reopened, labeled]
    paths:
      - "frontend/**"
      - ".github/workflows/vercel-deploy.yml"
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/vercel-deploy.yml"
  workflow_dispatch:
    inputs:
      target:
        description: "preview, or production (production only from main)"
        required: true
        type: choice
        options: [preview, production]
        default: preview
      alias_only_url:
        description: "AA-911: skip the deploy; point booking-preview.lumiguides.it.com at this existing preview (https://aa-booking-admin-….vercel.app)"
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  # One group per ref AND target, so a manual preview on main can never cancel a production deploy.
  # An alias-only dispatch gets its own group, so it never cancels a manual preview deploy on the same ref.
  # A run for any label other than preview-signin deploys nothing, so it gets a throw-away group and can never
  # cancel an in-flight preview deploy of the same PR.
  group: ${{ (github.event_name == 'pull_request' && github.event.action == 'labeled' && github.event.label.name != 'preview-signin') && format('vercel-deploy-noop-{0}', github.run_id) || format('vercel-deploy-{0}-{1}', github.ref, github.event_name == 'pull_request' && 'preview' || (github.event_name == 'push' && 'production' || (inputs.alias_only_url != '' && 'alias' || inputs.target))) }}
  # A newer push cancels an in-flight PREVIEW only; a production deploy is never cancelled mid-way
  # (a newer main push waits for it instead).
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.target == 'preview') }}

env:
  VERCEL_ORG_ID: team_zHOmLxnHRN3EC6hXHbXgTG81
  VERCEL_PROJECT_ID: prj_tDXiAMloqOlXEp3NKuJFDhvRuroV # aa-booking-admin
  VERCEL_CLI: vercel@60.0.1
  VERCEL_TELEMETRY_DISABLED: "1"
  # AA-911: the fixed Preview host (a Vercel domain of aa-booking-admin, a Cognito booking-staff callback).
  PREVIEW_SIGNIN_HOST: booking-preview.lumiguides.it.com
  # AA-993 V5: the public production custom domain (`vercel deploy --prod` points it at the new deployment).
  PRODUCTION_HOST: booking.lumiguides.it.com

jobs:
  deploy:
    name: Vercel deploy
    runs-on: ubuntu-latest
    # PRs from forks get no secrets — never try to deploy them. Neither do runs Dependabot triggers
    # (AA-903): `github.actor` is dependabot[bot] on its PR events and on re-runs of them, i.e. exactly
    # the runs without VERCEL_TOKEN, so the job shows as skipped instead of red. A human push onto a
    # Dependabot branch runs as that human (secrets present) and still deploys a preview.
    # Only pull_request runs are skipped: a push to main or a dispatch always deploys, so a production
    # deploy that cannot run (even one Dependabot triggered by merging its own PR) still fails red.
    # An alias-only dispatch (AA-911) deploys nothing: only job `preview-alias` runs.
    if: >-
      (github.event_name != 'workflow_dispatch' || inputs.alias_only_url == '') &&
      (github.event_name != 'pull_request' ||
       (github.actor != 'dependabot[bot]' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        (github.event.action != 'labeled' || github.event.label.name == 'preview-signin')))
    permissions:
      contents: read
    outputs:
      enabled: ${{ steps.plan.outputs.enabled }}
      target: ${{ steps.plan.outputs.target }}
      sha: ${{ steps.plan.outputs.sha }}
      url: ${{ steps.deploy.outputs.url }}
      outcome: ${{ steps.deploy.outcome }}
    steps:
      # All values reach `run:` through env (never `${{ }}` interpolation inside the script).
      - name: Plan (target, commit, token present?)
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          INPUT_TARGET: ${{ inputs.target }}
          REF: ${{ github.ref }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          HAS_TOKEN: ${{ secrets.VERCEL_TOKEN != '' }}
        run: |
          case "$EVENT" in
            pull_request) TARGET=preview ;;
            push) TARGET=production ;;
            *) TARGET="${INPUT_TARGET:-preview}" ;;
          esac
          if [ "$TARGET" = "production" ] && [ "$REF" != "refs/heads/main" ]; then
            echo "::error::Production deploys only from main (this run is on $REF)."
            exit 1
          fi
          # No token = no deployment at all (the Git integration is off), so fail RED on every target:
          # a green run with nothing deployed would pass a "CI green" check while production stays old.
          if [ "$HAS_TOKEN" != "true" ]; then
            if [ "$TARGET" = "production" ]; then
              echo "::error::VERCEL_TOKEN is not set — this commit was NOT deployed to Vercel production (the Git integration is off). Set the secret, then re-run this workflow or dispatch it with target=production."
            else
              echo "::error::VERCEL_TOKEN is not set — no preview was deployed (the Git integration is off). Set the secret, then re-run this workflow."
            fi
            exit 1
          fi
          ENABLED=true
          {
            echo "target=$TARGET"
            echo "sha=$SHA"
            echo "enabled=$ENABLED"
          } >> "$GITHUB_OUTPUT"
          echo "Target: $TARGET | commit: $SHA | deploy enabled: $ENABLED"

      - name: Checkout the commit to deploy
        if: steps.plan.outputs.enabled == 'true'
        uses: actions/checkout@v7
        with:
          # The PR HEAD commit (not the synthetic merge commit), like the Git integration deployed.
          ref: ${{ steps.plan.outputs.sha }}
          persist-credentials: false

      - name: Set up Node 22
        if: steps.plan.outputs.enabled == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      # stdout of `vercel deploy` is the deployment URL; progress / build logs go to stderr.
      # The CLI waits for the remote build and exits non-zero when it fails.
      - name: Deploy (remote build of frontend/ via the project's Root Directory)
        if: steps.plan.outputs.enabled == 'true'
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          TARGET: ${{ steps.plan.outputs.target }}
        run: |
          set -euo pipefail
          ARGS=(deploy --yes --token "$VERCEL_TOKEN" --scope "$VERCEL_ORG_ID")
          if [ "$TARGET" = "production" ]; then ARGS+=(--prod); fi
          npx --yes "$VERCEL_CLI" "${ARGS[@]}" > "$RUNNER_TEMP/vercel-deploy.out"
          URL=$(grep -Eo 'https://[^[:space:]]+' "$RUNNER_TEMP/vercel-deploy.out" | tail -n1 || true)
          if [ -z "$URL" ]; then
            echo "::error::vercel deploy printed no deployment URL."
            exit 1
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Deployed ($TARGET): $URL"

      # Production protection keeps the deployment URL behind Vercel auth (custom domains are public),
      # so the URL is checked with the automation-bypass header when that secret exists; otherwise
      # the status is only logged.
      - name: Check the production deployment answers
        if: steps.plan.outputs.target == 'production' && steps.deploy.outputs.url != ''
        env:
          URL: ${{ steps.deploy.outputs.url }}
          BYPASS: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          CODE=000
          for _ in 1 2 3; do
            if [ -n "$BYPASS" ]; then
              CODE=$(curl -sS -L -o /dev/null -w '%{http_code}' --max-time 30 \
                       -H "x-vercel-protection-bypass: $BYPASS" "$URL/" || echo 000)
            else
              CODE=$(curl -sS -L -o /dev/null -w '%{http_code}' --max-time 30 "$URL/" || echo 000)
            fi
            [ "$CODE" = "200" ] && break
            sleep 10
          done
          echo "GET $URL/ -> HTTP $CODE"
          if [ "$CODE" != "200" ]; then
            if [ -n "$BYPASS" ]; then
              echo "::error::Production deployment answered HTTP $CODE (expected 200)."
              exit 1
            fi
            echo "::notice::No VERCEL_AUTOMATION_BYPASS_SECRET — status only logged (401/403 = deployment protection)."
          fi

      # AA-879 — the deployment just built (preview or production) must send the six security headers of
      # frontend/next.config.ts. The deployment URL sits behind Vercel protection; the script reads it with
      # `vercel curl` (team token from VERCEL_TOKEN, the project's own automation-bypass token, nothing new
      # to store). /login is the one page that answers 200 without a session.
      - name: Check the security headers
        if: steps.deploy.outputs.url != ''
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          URL: ${{ steps.deploy.outputs.url }}
        run: bash .github/scripts/check_security_headers.sh "$URL" /login

      - name: Job summary
        if: always() && steps.plan.outputs.enabled == 'true'
        env:
          TARGET: ${{ steps.plan.outputs.target }}
          SHA: ${{ steps.plan.outputs.sha }}
          URL: ${{ steps.deploy.outputs.url }}
          OUTCOME: ${{ steps.deploy.outcome }}
        run: |
          {
            echo "### Vercel deploy — $TARGET"
            echo ""
            echo "- Commit: \`$SHA\`"
            echo "- Result: $OUTCOME"
            echo "- URL: ${URL:-n/a}"
          } >> "$GITHUB_STEP_SUMMARY"

  # ── AA-911: point the fixed Preview sign-in host at a preview deployment (opt-in) ──
  preview-alias:
    name: Point booking-preview at the preview
    needs: deploy
    # PR path: the PR deploy succeeded and the PR carried the label `preview-signin` at event time.
    # Dispatch path: alias_only_url was given (deploy job skipped). Never on push (production).
    if: >-
      always() &&
      ((github.event_name == 'pull_request' &&
        needs.deploy.result == 'success' &&
        needs.deploy.outputs.target == 'preview' &&
        needs.deploy.outputs.url != '' &&
        contains(github.event.pull_request.labels.*.name, 'preview-signin')) ||
       (github.event_name == 'workflow_dispatch' && inputs.alias_only_url != ''))
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # One alias change at a time across all PRs and dispatches; a newer pending run replaces an older one.
    concurrency:
      group: vercel-alias-booking-preview
      cancel-in-progress: false
    steps:
      - name: Check the deployment (this project, not production, READY), then alias it
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          PR_URL: ${{ needs.deploy.outputs.url }}
          DISPATCH_URL: ${{ inputs.alias_only_url }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "workflow_dispatch" ]; then
            # Lesson S241: a dispatch on an old branch runs that branch's copy of this workflow with the
            # repo secrets, so the alias-only path is accepted only from main.
            if [ "$REF" != "refs/heads/main" ]; then
              echo "::error::alias_only_url is accepted only on refs/heads/main (this run is on $REF)."
              exit 1
            fi
            URL="$DISPATCH_URL"
          else
            URL="$PR_URL"
          fi
          URL="${URL%/}"
          # Only this project's per-deployment preview URLs; never a custom domain or another project.
          if ! [[ "$URL" =~ ^https://aa-booking-admin-[a-z0-9-]+\.vercel\.app$ ]]; then
            echo "::error::Not an aa-booking-admin deployment URL: $URL"
            exit 1
          fi
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::VERCEL_TOKEN is not set."
            exit 1
          fi
          HOST="${URL#https://}"
          curl -fsS --max-time 30 -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v13/deployments/$HOST?teamId=$VERCEL_ORG_ID" > "$RUNNER_TEMP/deployment.json"
          PROJECT=$(jq -r '.projectId // ""' "$RUNNER_TEMP/deployment.json")
          TARGET=$(jq -r '.target // "preview"' "$RUNNER_TEMP/deployment.json")
          STATE=$(jq -r '.readyState // ""' "$RUNNER_TEMP/deployment.json")
          echo "Deployment $HOST: project=$PROJECT target=$TARGET readyState=$STATE"
          if [ "$PROJECT" != "$VERCEL_PROJECT_ID" ]; then
            echo "::error::Deployment belongs to another project."
            exit 1
          fi
          if [ "$TARGET" = "production" ]; then
            echo "::error::Refusing to alias a production deployment to $PREVIEW_SIGNIN_HOST."
            exit 1
          fi
          if [ "$STATE" != "READY" ]; then
            echo "::error::Deployment is not READY ($STATE)."
            exit 1
          fi
          npx --yes "$VERCEL_CLI" alias set "$URL" "$PREVIEW_SIGNIN_HOST" --token "$VERCEL_TOKEN" --scope "$VERCEL_ORG_ID"
          {
            echo "### Preview sign-in host"
            echo ""
            echo "- https://$PREVIEW_SIGNIN_HOST → $URL"
          } >> "$GITHUB_STEP_SUMMARY"

  # ── AA-993 V5: public smoke of the production staff admin ──
  smoke:
    name: Public smoke (production)
    needs: deploy
    if: needs.deploy.result == 'success' && needs.deploy.outputs.target == 'production'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontend
    steps:
      # Production deploys run only from main, so github.sha is the deployed commit. No `ref:` and no npm
      # cache: a cached step after checking out another ref is a cache-poisoning path (CodeQL high, #103 review).
      - name: Checkout the deployed commit
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      # Public page only: no cookie, no token, nothing written. 2 retries on CI (playwright.config.ts).
      - name: Smoke /login on the production host
        run: SMOKE_BASE_URL="https://$PRODUCTION_HOST" npm run test:smoke-public

      - name: Upload the screenshot
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: booking-admin-smoke-public
          path: frontend/e2e/smoke-public/results/
          if-no-files-found: warn
          retention-days: 14

  # AA-993 V5 — the run's verdict. GitHub shows a skipped job grey, so without this a failed deploy (smoke then
  # skips) or a skipped smoke could pass for green. Production run (push to main, or a dispatch with
  # target=production and no alias_only_url): red unless deploy AND smoke succeeded. Anything else: not gated here.
  result:
    name: Vercel Deploy result
    runs-on: ubuntu-latest
    if: always()
    needs: [deploy, smoke]
    permissions: {}
    steps:
      - name: Production deployed and smoke-tested
        env:
          NEEDS: ${{ toJSON(needs) }}
          EVENT: ${{ github.event_name }}
          INPUT_TARGET: ${{ inputs.target }}
          ALIAS_ONLY_URL: ${{ inputs.alias_only_url }}
        run: |
          set -euo pipefail
          case "$EVENT" in
            push) TARGET=production ;;
            workflow_dispatch)
              if [ -n "$ALIAS_ONLY_URL" ]; then TARGET=alias-only; else TARGET="${INPUT_TARGET:-preview}"; fi ;;
            *) TARGET=preview ;;
          esac
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          if [ "$TARGET" != "production" ]; then
            echo "Vercel Deploy ($EVENT, $TARGET): not gated here; the deploy job's own status stands."
            exit 0
          fi
          BAD=$(echo "$NEEDS" | jq -r '[("deploy", "smoke") as $j | (.[$j].result // "missing") as $r
                                         | select($r != "success") | "\($j)=\($r)"] | join(", ")')
          if [ -n "$BAD" ]; then
            echo "::error::Production is not deployed and smoke-tested: $BAD"
            exit 1
          fi
          echo "Vercel Deploy ($EVENT): production deployed and smoke-tested."

  # ── Post/update ONE comment on the PR (marker comment, edited in place) ──
  comment:
    name: PR comment
    needs: [deploy, preview-alias]
    if: >-
      always() && github.event_name == 'pull_request' && needs.deploy.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Comment the preview URL on the PR
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ needs.deploy.outputs.sha }}
          URL: ${{ needs.deploy.outputs.url }}
          OUTCOME: ${{ needs.deploy.outputs.outcome }}
          ALIAS_RESULT: ${{ needs.preview-alias.result }}
          LABELLED: ${{ contains(github.event.pull_request.labels.*.name, 'preview-signin') }}
          SERVER_URL: ${{ github.server_url }}
          RUN_ID: ${{ github.run_id }}
        run: |
          MARKER="<!-- vercel-preview-deploy -->"
          RUN_URL="$SERVER_URL/$REPO/actions/runs/$RUN_ID"
          if [ "$OUTCOME" = "success" ] && [ -n "$URL" ]; then STATUS="✅ ready"; else STATUS="❌ failed"; fi
          if [ "$ALIAS_RESULT" = "success" ]; then
            SIGNIN="Staff sign-in: https://$PREVIEW_SIGNIN_HOST now serves this commit."
          elif [ "$LABELLED" = "true" ]; then
            SIGNIN="Staff sign-in: re-pointing https://$PREVIEW_SIGNIN_HOST did not succeed ($ALIAS_RESULT), see the run."
          else
            SIGNIN="Staff sign-in: not on this preview. Add the label preview-signin (one more deployment), or dispatch Vercel Deploy from main with alias_only_url=<preview URL> (root runbook preview-staff-sign-in)."
          fi
          # shellcheck disable=SC2016  # the backticks are literal Markdown
          BODY=$(printf '%s\n### Vercel preview — %s\n\nCommit: `%s`\n\nPreview: %s\n\n%s\n\n[Deploy run](%s)\n' \
                   "$MARKER" "$STATUS" "$SHA" "${URL:-n/a}" "$SIGNIN" "$RUN_URL")
          EXISTING=$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
                       --jq ".[] | select(.body | contains(\"$MARKER\")) | .id" 2>/dev/null | head -n1 || true)
          if [ -n "$EXISTING" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$EXISTING" -f body="$BODY" >/dev/null
            echo "Updated comment $EXISTING"
          else
            gh api -X POST "repos/$REPO/issues/$PR/comments" -f body="$BODY" >/dev/null
            echo "Created a new comment"
          fi
