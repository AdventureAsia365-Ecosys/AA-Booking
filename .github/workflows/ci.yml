name: CI

# Five required checks, named like AA-CIS-App's so branch protection reads the same
# (root ADR 0004 decision 3): Lint, Security Audit, Unit Tests, Integration Tests, Docker Build Check.
# A sixth, non-required check builds the staff frontend (ADR 0004 decision 3, "Frontend Build").
# A seventh, non-required check compares the files vendored from AA-CIS-App main ("Vendored CIS copies": the job
# table template, AA-751, and the multi-issuer verifier, AA-680).
# An eighth, "Migration preflight" (AA-993 M4b), classifies a PR's new migrations and refuses the cases that would leave
# Deploy Dev waiting on a manual apply; non-required until the ruleset adds it (pull_request and merge_group only).
# UI kit core (AA-994 S4b, root ADR 0016): frontend/ui/core is checked inside Frontend Build (integrity + provenance
# against frontend/kit.lock.json, kit lint at error with a suppressions file that only shrinks), not by "Vendored CIS
# copies".

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # AA-889 (merge queue): the queue tests each group on a temporary gh-readonly-queue/main/* commit and waits for
  # every required check there. All jobs run on it, with no path filter, so no required check is left unreported.
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: backend

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install ruff
        run: pip install "$(grep '^ruff==' requirements-dev.txt)"

      - name: ruff check
        run: ruff check .

      - name: ruff format --check
        run: ruff format --check .

  # Unlike CIS (report-only), pip-audit FAILS here. The same job runs the AA-902 resource-ID check. This repo carries
  # the DB role / password flow, so a committed secret is the most expensive mistake it can make (AA-678 notes): the
  # gitleaks scan that ran here moved to .github/workflows/secret-scan.yml (AA-981 follow-up), check "gitleaks" on
  # every PR with the base branch's rules and "gitleaks full history" (secret-scan-history.yml)
  # nightly and on push to main.
  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"

      # AA-902: this repo is public, so no AWS account ID, ARN with an account, VPC/SG/subnet ID, Cognito pool ID
      # or API Gateway host in any tracked file (DM-6.10). Stdlib only; runs first, it takes a second.
      - name: No literal AWS resource IDs (failing)
        working-directory: .
        run: python3 .github/scripts/check_resource_ids.py

      - name: pip-audit (runtime + dev requirements, failing)
        run: |
          pip install pip-audit==2.10.1 --quiet
          pip-audit -r requirements.txt
          pip-audit -r requirements-dev.txt

  test-unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # Includes the static migration guard (tests/unit/test_migration_guard.py) over migrations/*.sql.
      # AA-993 (BK-2): 4 xdist workers (pytest-xdist pinned in requirements-dev.txt). Integration Tests stays serial
      # (one shared PostgreSQL). BK-1: the Python 3.12 sys.monitoring coverage tracer cuts worker CPU; same report.
      - name: Run unit tests
        env:
          ENVIRONMENT: test
          COVERAGE_CORE: sysmon
        run: pytest tests/unit -n 4 --tb=short --cov=app --cov-report=term-missing --cov-fail-under=90

  # Applies migrations/*.sql in order to a real PostgreSQL 15 (the RDS major version) logged in as
  # aa_cis_admin (the DB Migrate identity), on a stub `shared` schema, exactly as
  # AA-CIS-Infra db/run_migration.py does; re-applies them (idempotency); checks the role `booking`
  # privileges; then calls /booking/health/ready as role `booking`.
  # X1 plan S5 (AA-Ecosys docs/audits/2026-10-17-S241-x1/x1-plan.md): the container superuser is `postgres`
  # and is used only by tests/integration/bootstrap_roles.py, which gives the database the RDS role shape:
  # aa_cis_admin NOSUPERUSER CREATEROLE CREATEDB (owner of the database, member of bk_owner), bk_owner
  # NOLOGIN, booking LOGIN. The tests then run as that non-superuser, like DB Migrate on RDS, and each file
  # runs as its migration role (SET ROLE bk_owner from bk-015 on, XD8).
  test-integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: booking_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d booking_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # -rs lists skips; a skipped integration test would make this check green without testing anything.
      - name: Run integration tests (no skips allowed)
        env:
          ENVIRONMENT: test
          BOOKING_TEST_ADMIN_DSN: postgresql://aa_cis_admin:ci-only@localhost:5432/booking_ci
        run: |
          set -o pipefail
          python -m tests.integration.bootstrap_roles "postgresql://postgres:ci-only@localhost:5432/booking_ci"
          pytest tests/integration -v --tb=short -rs -p no:cacheprovider | tee /tmp/integration.txt
          if grep -qE "^SKIPPED|[0-9]+ skipped" /tmp/integration.txt; then
            echo "::error::integration tests were skipped"; exit 1
          fi

  docker-build:
    name: Docker Build Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # AA-891: the release version comes from the manifest at the repo root, like the Deploy Dev build.
      - name: Build image
        run: |
          docker build \
            --build-arg GIT_SHA=${{ github.sha }} \
            --build-arg APP_VERSION="$(jq -r '."."' ../.release-please-manifest.json)" \
            --tag aa-booking-api:ci-${{ github.sha }} \
            .

      # The image must start and answer liveness without a database (ALB health check contract).
      - name: Container answers /booking/health without a database
        run: |
          set -euo pipefail
          docker run -d --name booking-ci -p 8000:8000 aa-booking-api:ci-${{ github.sha }}
          for i in $(seq 1 20); do
            if curl -sf http://localhost:8000/booking/health -o /tmp/health.json; then break; fi
            sleep 1
          done
          cat /tmp/health.json
          jq -e --arg sha "${{ github.sha }}" --arg ver "$(jq -r '."."' ../.release-please-manifest.json)" \
            '.status == "ok" and .service == "aa-booking-api" and .git_sha == $sha and .version == $ver' /tmp/health.json
          code=$(curl -s -o /tmp/ready.json -w "%{http_code}" http://localhost:8000/booking/health/ready)
          cat /tmp/ready.json
          [ "$code" = "503" ] && jq -e '.db == "not_configured"' /tmp/ready.json
          docker rm -f booking-ci

      # AA-879: blocking, like CIS. Fails on any CRITICAL/HIGH finding that HAS a fix (`ignore-unfixed`).
      # Reviewed report before the flip (main run 39622898902, 21/10/2026): 44 HIGH OS findings, none with a
      # fixed version. An accepted fixable finding goes into .trivyignore (repo root) with a `# reason` line
      # and `exp:YYYY-MM-DD` at most 90 days ahead; .github/scripts/check_trivyignore.py is a byte copy of
      # the AA-CIS-App script (tested there, tests/unit/test_aa879_ci_gates.py).
      - name: Trivy ignore entries carry a reason and an expiry
        working-directory: .
        run: python3 .github/scripts/check_trivyignore.py .trivyignore

      - name: Scan image for vulnerabilities (Trivy, failing on fixable CRITICAL/HIGH)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: "aa-booking-api:ci-${{ github.sha }}"
          format: "table"
          severity: "CRITICAL,HIGH"
          ignore-unfixed: true
          trivyignores: ".trivyignore"
          exit-code: "1"

      - name: Generate SBOM (syft, CycloneDX)
        uses: anchore/sbom-action@v0.24.3
        with:
          image: "aa-booking-api:ci-${{ github.sha }}"
          format: cyclonedx-json
          output-file: sbom-${{ github.sha }}.cdx.json
          artifact-name: sbom-${{ github.sha }}.cdx.json

  # Non-required (AA-751, S240 decision): byte copies of AA-CIS-App files — backend/tests/job_template/ (shared/jobs/
  # job_table_template.sql + job_table_shape.py, ADR 0003a decision 2; Integration Tests compares booking.job with that
  # template) and backend/app/auth/identity_verifier.py (api/core/identity_verifier.py, root ADR 0006 §8 rule 9,
  # AA-680). This job fails when a copy drifts from CIS main. Stdlib only, no install; the repos are public,
  # github.token only lifts the API rate limit.
  vendored-copies:
    name: Vendored CIS copies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Compare the vendored CIS files with AA-CIS-App main
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/check_vendored_copies.py

  # AA-993 M4b (root ADR 0017 d1, design D2.1; critic 7, 17): "Migration preflight". Tells the author of a PR that
  # adds a migration whether it will be auto-applied (header `-- migrate: expand`, lint clean, classify evidence
  # expand) or needs a person (contract / destructive: MIG-4), and refuses: an edit/delete of a file already copied to
  # AA-CIS-Infra, a number other than main max + 1 (label migration:out-of-order for a reserved one), a readiness raise
  # to a non-expand file or to a key with no file, a runner/ownership lint error, an expand header the classify replay
  # contradicts. Tools: AA-CIS-Infra db/run_migration.py --inspect, db/check_migration_ownership.py and
  # db/expand_check.py --classify at the pinned INFRA_TOOLS_SHA (public repo, anonymous clone; bump the pin when the
  # Infra runner changes). The Infra copy PR's required "Expand classify" and Migration Apply's re-classify stay the
  # authority. Runs on pull_request and merge_group (the queue re-checks the number on the latest main); exits at once
  # when the PR touches no migration and no readiness key. Logic: .github/scripts/migration_preflight.py.
  # Same steps in AA-CIS-App, AA-Booking and AA-Partner; only the env block differs.
  migration-preflight:
    name: Migration preflight
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      pull-requests: read    # the PR's labels (migration:out-of-order), read live
    defaults:
      run:
        working-directory: .
    env:
      OWNER: booking
      MIG_DIR: migrations
      READINESS_FILE: backend/app/db.py
      # Public readiness of Dev: registered_keys tell whether a lower key of this owner still waits for a person.
      READY_URL: https://api-booking.lumiguides.it.com/booking/health/ready
      INFRA_REPO: AdventureAsia365-Ecosys/AA-CIS-Infra
      # AA-CIS-Infra main after M3 (#493/#494): run_migration.py with the expand lint, expand_check.py --classify.
      INFRA_TOOLS_SHA: 3b999913ba990e5e2ca8d3fbd8efb4d44980ca76
      # pgvector/pgvector:0.8.1-pg15, the image of the Infra classify and DB Schema Dump replay.
      REPLAY_IMAGE: pgvector/pgvector@sha256:94aee7e88f98125114657cab98e28c5dfa8dd517a6bf83fd98b503439f1e3de6
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: What the PR changes
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          GROUP_BASE: ${{ github.event.merge_group.base_sha }}
          GROUP_REF: ${{ github.event.merge_group.head_ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # The label is read live in both cases (not from the event payload): adding migration:out-of-order and
          # "Re-run jobs" is enough, no empty commit needed.
          if [ "$EVENT" = "merge_group" ]; then
            BASE="$GROUP_BASE"
            git fetch --quiet --depth=1 origin "$BASE"
            PR=$(sed -nE 's#.*/pr-([0-9]+)-[0-9a-f]+$#\1#p' <<<"$GROUP_REF")
          else
            BASE=$(git rev-parse HEAD^1)    # the merge commit's first parent = the base this PR is tested on
            PR="$PR_NUMBER"
          fi
          OOO=false
          if [ -n "$PR" ] && gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json labels --jq '.labels[].name' \
              | grep -qx 'migration:out-of-order'; then OOO=true; fi
          git diff --name-status --no-renames "$BASE" HEAD -- "$MIG_DIR" "$READINESS_FILE" | tee changes.txt
          ADDED=$(grep -cE "^A[[:space:]]+${MIG_DIR}/[0-9]{3}_[^/]*\.sql$" changes.txt || true)
          {
            echo "base=$BASE"
            echo "ooo=$OOO"
            echo "relevant=$([ -s changes.txt ] && echo true || echo false)"
            echo "added=$ADDED"
          } >> "$GITHUB_OUTPUT"

      - name: Pinned AA-CIS-Infra tools and the Infra copy list
        id: infra
        if: steps.scope.outputs.relevant == 'true'
        run: |
          set -uo pipefail
          git init -q infra && git -C infra remote add origin "https://github.com/$INFRA_REPO.git"
          if git -C infra fetch -q --depth 1 origin "$INFRA_TOOLS_SHA" && git -C infra checkout -q FETCH_HEAD; then
            echo "tools=infra" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::AA-CIS-Infra $INFRA_TOOLS_SHA not readable (private?): header only, no runner lint"
          fi
          mkdir -p infra-main
          if git -C infra fetch -q --depth 1 origin main && git -C infra archive FETCH_HEAD db/migrations | tar -x -C infra-main; then
            echo "copies=infra-main/db/migrations/$OWNER" >> "$GITHUB_OUTPUT"
            echo "AA-CIS-Infra main: $(git -C infra rev-parse --short FETCH_HEAD)"
          else
            echo "::warning::AA-CIS-Infra main not readable: every migration on main counts as copied"
          fi

      - name: Classify the added files (expand post-check on a replay of Dev)
        id: classify
        if: steps.scope.outputs.added != '0' && steps.infra.outputs.tools == 'infra' && steps.infra.outputs.copies != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          python -m pip install --quiet asyncpg==0.30.0 pyyaml==6.0.2
          # Each owner's main with the Infra copies laid over it (as Migration Apply does); this PR's folder for its owner.
          declare -A SRC=([cis]="AA-CIS-App api/migrations" [booking]="AA-Booking migrations"
                          [tripplanner]="AA-TripPlanner-Web migrations" [crm]="AA-Partner api/migrations")
          ARGS=(--source roles=infra-main/db/migrations/roles)
          for o in cis booking tripplanner crm; do
            mkdir -p "replay/$o"
            if [ "$o" = "$OWNER" ]; then
              cp "$MIG_DIR"/*.sql "replay/$o/"
            else
              read -r repo dir <<<"${SRC[$o]}"
              git clone --quiet --depth 1 --filter=blob:none --sparse "https://github.com/AdventureAsia365-Ecosys/$repo.git" "owners/$o"
              git -C "owners/$o" sparse-checkout set "$dir"
              cp "owners/$o/$dir"/*.sql "replay/$o/"
              cp infra-main/db/migrations/"$o"/*.sql "replay/$o/" 2>/dev/null || true
            fi
            ARGS+=(--source "$o=replay/$o")
          done
          RUN=$(gh run list -R "$INFRA_REPO" --workflow db-schema-dump.yml --branch main --status success \
            --limit 1 --json databaseId --jq '.[0].databaseId // empty' 2>/dev/null || true)
          if [ -n "$RUN" ] && gh run download "$RUN" -R "$INFRA_REPO" -n "db-schema-dump-$RUN" -D dump 2>/dev/null \
              && [ -s dump/schema.json ]; then
            ARGS+=(--live dump/schema.json); echo "replay order: the live dump of AA-CIS-Infra DB Schema Dump run $RUN"
          else
            echo "::notice::no AA-CIS-Infra DB Schema Dump artifact readable: the replay falls back to number order"
          fi
          ARGS+=(--files)
          while read -r f; do ARGS+=("$OWNER/$(basename "$f")"); done \
            < <(grep -E "^A[[:space:]]+${MIG_DIR}/[0-9]{3}_[^/]*\.sql$" changes.txt | cut -f2)
          PW="$(openssl rand -hex 16)"
          docker run -d --name classify-db -e POSTGRES_PASSWORD="$PW" -p 127.0.0.1:55432:5432 "$REPLAY_IMAGE" >/dev/null
          for _ in $(seq 1 60); do docker exec classify-db pg_isready -h 127.0.0.1 -U postgres -q && break; sleep 2; done
          python3 infra/db/expand_check.py --classify "${ARGS[@]}" \
            --admin-dsn "postgresql://postgres:${PW}@127.0.0.1:55432/postgres" \
            --out classify.json --summary "$GITHUB_STEP_SUMMARY" > classify.log 2>&1
          STATUS=$?
          grep -v '^REPLAY ok' classify.log || true
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          docker rm -f classify-db >/dev/null 2>&1 || true

      - name: Preflight verdict
        env:
          BASE: ${{ steps.scope.outputs.base }}
          TOOLS: ${{ steps.infra.outputs.tools }}
          COPIES: ${{ steps.infra.outputs.copies }}
          CLASSIFY_STATUS: ${{ steps.classify.outputs.status }}
          OOO: ${{ steps.scope.outputs.ooo }}
        run: |
          ARGS=(--app "$OWNER" --migrations-dir "$MIG_DIR" --readiness-file "$READINESS_FILE" --base "$BASE")
          [ -n "$TOOLS" ] && ARGS+=(--infra-tools "$TOOLS")
          [ -n "$COPIES" ] && ARGS+=(--infra-copies "$COPIES")
          [ -s classify.json ] && ARGS+=(--classify-json classify.json)
          [ -n "$CLASSIFY_STATUS" ] && ARGS+=(--classify-status "$CLASSIFY_STATUS")
          [ "$OOO" = "true" ] && ARGS+=(--allow-out-of-order)
          python3 .github/scripts/migration_preflight.py "${ARGS[@]}" --ready-url "$READY_URL"

  # Non-required (ADR 0004 decision 3): eslint, tsc and `next build` of the staff admin in frontend/.
  # Mirrors the CIS frontend checks. Needs no secret: the app reads BOOKING_API_URL / CIS_API_URL at
  # runtime and falls back to the Dev defaults in frontend/lib/config.ts.
  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      # AA-994 S4b (root ADR 0016 decision 5) — the vendored UI kit core, before npm ci (dependency-free). Integrity:
      # every file of ui/core has the sha256 of its MANIFEST.json, no file is missing or extra, the manifest is the one
      # kit.lock.json pins, and no CSS file outside ui/core/tokens.css defines an --aa-* variable (Booking-only values
      # are --bk-*). Provenance: that manifest is AA-CIS-App's at the lock's ref and the ref is on CIS main (reads
      # GitHub only when this change touches frontend/kit.lock.json or frontend/ui/core; otherwise it passes at once).
      - name: Kit core integrity (check-kit-copy.mjs)
        run: |
          node ui/core/check-kit-copy.mjs
          node ui/core/check-kit-copy.mjs --css .

      - name: Kit core provenance (kit.lock.json ref on AA-CIS-App main)
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before || '' }}
        run: python3 ../backend/scripts/check_kit_provenance.py kit.lock.json --base "$BASE_SHA"

      - name: Install dependencies
        id: install
        run: npm ci

      # AA-994 S4b (root ADR 0016 decision 7, plan guards G1-G11) — page code (app/**) and the Booking components
      # (ui/booking/**) are linted with the kit preset (ui/core/eslint-kit.mjs, `tailwind`) at `error`, no warnings
      # allowed; violations that existed before S4b are frozen in frontend/eslint-suppressions.json (ESLint bulk
      # suppressions), which only shrinks:
      #   1. `eslint --prune-suppressions` fails on any violation the file does not cover and rewrites the file;
      #   2. the committed file must equal the pruned one (a fix that did not prune its entries fails);
      #   3. no entry and no rule total may grow against the base branch's file (a `--suppress-all` that hides new
      #      violations fails), a new entry may only carry a deleted/renamed file's violations into a file the base did
      #      not have, and no entry may name a deleted file;
      #   4. no inline `eslint-disable` of a kit rule (or bare `eslint-disable`) in page code.
      # They run even when an earlier step failed (once npm ci succeeded), so one run shows every reason.
      - name: Lint (eslint, kit preset at error, no warnings, suppressions pruned)
        id: eslint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npx eslint --max-warnings 0 --prune-suppressions

      - name: Suppressions file is pruned
        if: ${{ !cancelled() && steps.eslint.conclusion != 'skipped' }}
        run: |
          if ! git diff --exit-code -- eslint-suppressions.json; then
            echo "::error file=frontend/eslint-suppressions.json::Violations were fixed but their suppressions were not removed. Run 'npx eslint --prune-suppressions' in frontend/ and commit eslint-suppressions.json (the diff above)."
            exit 1
          fi
          git checkout -- eslint-suppressions.json

      - name: Suppressions do not grow
        if: ${{ !cancelled() && steps.eslint.conclusion != 'skipped' }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        run: |
          case "$BASE_SHA" in
            ""|0000000000000000000000000000000000000000)
              echo "::notice::No base commit for this event: suppressions growth check skipped."
              exit 0 ;;
          esac
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          BASE_FILE="$RUNNER_TEMP/base-eslint-suppressions.json"
          if ! git show "$BASE_SHA:frontend/eslint-suppressions.json" > "$BASE_FILE" 2>/dev/null; then
            echo "::notice::The base commit has no frontend/eslint-suppressions.json (this change creates the baseline): growth check skipped."
            exit 0
          fi
          BASE_LIST="$RUNNER_TEMP/base-frontend-files.txt"
          git ls-tree -r --name-only "$BASE_SHA" -- . > "$BASE_LIST"  # paths relative to frontend/ (the cwd)
          node ui/core/check-kit-copy.mjs --suppressions "$BASE_FILE" eslint-suppressions.json --base-files "$BASE_LIST"

      - name: No inline disable of a kit rule
        if: ${{ !cancelled() }}
        run: |
          node ui/core/check-kit-copy.mjs --no-kit-disable app
          node ui/core/check-kit-copy.mjs --no-kit-disable ui/booking

      - name: Typecheck (tsc --noEmit)
        run: npm run typecheck

      # AA-996: pure helpers (ui/booking/dates.ts) under Node's built-in runner; Node 22 strips the TypeScript types.
      - name: Unit tests (node --test)
        run: npm run test:unit

      - name: Build (next build)
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build
