# AA-895 (S243): same model as AA-CIS-App (S242) and AA-CIS-Infra (AA-867).
# - npm (/frontend) and pip (/backend): security updates only, grouped into one PR per ecosystem per week.
#   Version updates are off (open-pull-requests-limit: 0); the weekly schedule only paces the group.
# - github-actions: weekly version updates, grouped into one PR (pinned action versions are a supply-chain
#   control; Infra does the same).
# Dependabot PRs get no repository secrets; since the Vercel retirement (AA-911, S272) no per-PR check needs one
# (Visual runs on `next start`). Alerts and security updates are switched on in the repo
# settings (on since AA-867). Triage and SLA: AA-Ecosys docs/security/vulnerability-management.md.
version: 2
updates:
  - package-ecosystem: npm
    directory: "/frontend"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 0
    groups:
      frontend-security:
        applies-to: security-updates
        patterns: ["*"]
    commit-message:
      prefix: "chore(deps)"
  - package-ecosystem: pip
    directory: "/backend"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 0
    groups:
      python-security:
        applies-to: security-updates
        patterns: ["*"]
    commit-message:
      prefix: "chore(deps)"
  # AA-1164: the Node base image of frontend/Dockerfile is pinned by tag and digest; Dependabot moves both weekly,
  # Node 22 patch and minor only (a major version is a deliberate change), one PR at a time. Like the PRs above, it
  # gets no repository secrets; the deploy that follows its merge rebuilds and redeploys the image.
  - package-ecosystem: docker
    directory: "/frontend"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 1
    ignore:
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
    groups:
      base-image:
        patterns: ["*"]
    commit-message:
      prefix: "chore(deps)"
  - package-ecosystem: github-actions
    # "/" reads .github/workflows; the composite actions in .github/actions/<name>/action.yml are read too (AA-1024)
    directories: ["/", "/.github/actions/*"]
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 1
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: chore
